name: Deploy frontend

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "assets/**"
      - "config/production.json"
      - "index.html"
      - "public/**"
      - "scripts/prepare-pages-preview.mjs"
      - "scripts/configure-pages-production.mjs"
      - "scripts/seo-pages.mjs"
      - "scripts/serve-dist.mjs"
      - "scripts/verify-production.mjs"
      - "src/**"
      - "tests/e2e/pwa.spec.ts"
      - "tests/e2e/react-*.spec.ts"
      - "playwright.pwa.config.ts"
      - "playwright.react.config.ts"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-frontend.yml"
      - ".env.example"

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-pages
    env:
      VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
      VITE_GSC_VERIFICATION: ${{ vars.VITE_GSC_VERIFICATION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm


      - name: Dependencias
        run: npm ci

      - name: Calidad frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E y PWA
        run: npm run test:e2e

      - name: Alinear rama de producción de Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOPPER_PAGES_PROJECT: hopper-transfer
          HOPPER_PRODUCTION_BRANCH: master
        run: node scripts/configure-pages-production.mjs

      - name: Desplegar Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=hopper-transfer --branch=master

      - name: Confirmar entorno de Pages
        env:
          PAGES_ENVIRONMENT: ${{ steps.deploy.outputs.pages-environment }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          echo "Cloudflare Pages: $DEPLOYMENT_URL"
          echo "Alias de Pages: $DEPLOYMENT_ALIAS_URL"
          echo "Entorno de Pages: $PAGES_ENVIRONMENT"
          if [ -n "$PAGES_ENVIRONMENT" ] && [ "$PAGES_ENVIRONMENT" != "production" ]; then
            echo "El despliegue terminó en '$PAGES_ENVIRONMENT' y no en producción." >&2
            exit 1
          fi

      - name: Verificar build publicado
        env:
          HOPPER_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/verify-production.mjs