name: Visual regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "assets/**"
      - "index.html"
      - "public/**"
      - "src/**"
      - "tests/e2e/react-visual-regression.spec.ts"
      - "tests/e2e/visual/baselines/**"
      - "playwright.react.config.ts"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Regresión visual React
        run: npx playwright test tests/e2e/react-visual-regression.spec.ts --config playwright.react.config.ts
