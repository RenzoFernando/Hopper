name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Dependencias del Worker
        run: |
          if [ -f worker/package-lock.json ]; then
            npm ci --prefix worker
          else
            npm install --prefix worker --no-audit --no-fund
          fi

      - name: Validar estructura Fase 5
        run: node scripts/phase5-check.mjs

      - name: TypeScript del Worker
        run: npm --prefix worker run typecheck

      - name: Seguridad del Worker
        run: npm --prefix worker test

      - name: ESLint
        run: npm run lint

      - name: TypeScript frontend
        run: npm run typecheck

      - name: Unitarios
        run: npm run test

      - name: Regresión backend
        run: npm run test:legacy

      - name: Integración
        run: npm run test:integration

      - name: Build
        run: npm run build

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E, PWA y regresión visual
        run: npm run test:e2e
