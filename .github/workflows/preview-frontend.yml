name: Frontend preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencias
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Validación
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run test:legacy
          npm run test:integration

      - name: Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E, PWA y build
        run: npm run test:e2e

      - name: Desplegar preview de Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name hopper-preview --branch phase-3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
