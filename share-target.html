<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Enviar contenido compartido a Hopper.">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#202123">
    <title>Compartir — Hopper</title>
    <link rel="icon" href="assets/favicon.ico" sizes="any">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body class="document-page compact-document-page">
    <div class="document-shell">
      <header class="site-header"><a class="brand" href="./" aria-label="Volver a Hopper"><img class="brand-mark" src="assets/favicon.svg" alt=""><span class="brand-name">HOPPER</span></a></header>
      <main class="share-main">
        <section class="share-card" aria-labelledby="share-title">
          <p class="eyebrow">COMPARTIR</p><h1 id="share-title">Enviar a</h1>
          <div class="share-summary" id="share-summary"></div>
          <div class="share-auth" id="share-auth">
            <p class="share-auth-copy" id="share-auth-copy">Accede a Mi espacio o entra a una sala para elegir el destino.</p>
            <form class="share-auth-form" id="share-pin-form" novalidate>
              <label for="share-pin">PIN ADMIN</label>
              <div class="share-auth-row"><input id="share-pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="current-password" enterkeyhint="go" aria-label="PIN de Mi espacio" placeholder="••••"><button class="secondary-button" id="share-pin-submit" type="submit">Entrar</button></div>
              <p class="share-auth-message" id="share-pin-message" aria-live="polite" hidden></p>
            </form>
            <div class="share-auth-divider" id="share-auth-divider" aria-hidden="true"><span>o</span></div>
            <form class="share-auth-form" id="share-room-form" novalidate>
              <label for="share-room-code">Código de sala</label>
              <div class="share-auth-row"><input id="share-room-code" type="text" inputmode="text" maxlength="7" pattern="[A-Za-z]{2}-[0-9]{4}" autocomplete="off" autocapitalize="characters" enterkeyhint="go" spellcheck="false" aria-label="Código de sala" placeholder="XX-0000"><button class="secondary-button" id="share-room-submit" type="submit">Entrar</button></div>
              <p class="share-auth-message" id="share-room-message" aria-live="polite" hidden></p>
            </form>
          </div>
          <label class="field-label" id="share-destination-field" for="share-destination">Destino<select id="share-destination"></select></label>
          <label class="field-label" id="share-ttl-field" for="share-ttl">Expira en<select id="share-ttl"><option value="5" selected>5 min</option><option value="15">15 min</option><option value="30">30 min</option><option value="60">1 hora</option><option value="360">6 horas</option></select></label>
          <p class="share-progress" id="share-progress" aria-live="polite"></p><p class="form-message" id="share-message" aria-live="polite"></p>
          <div class="share-actions"><button class="secondary-button" id="share-discard" type="button">Descartar</button><button class="primary-button" id="share-send" type="button">Enviar</button></div>
        </section>
      </main>
    </div>
    <footer class="project-footer"><p><a href="https://github.com/RenzoFernando/Hopper" target="_blank" rel="noopener noreferrer"><strong>Hopper</strong></a><span> — Transferencia temporal de texto y archivos</span></p><p>© 2026 — Renzo Fernando Mosquera Daza</p></footer>
    <script type="module" src="js/share-target.js"></script>
  </body>
</html>
