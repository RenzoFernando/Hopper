<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hopper — Envío rápido</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header"><div class="brand"><img src="icons/48.png" alt="" width="30" height="30"><strong>HOPPER</strong></div><div class="connection"><span class="status-dot" id="status-dot"></span><span id="connection-label">Conectando…</span></div></header>
  <main>
    <div id="message" role="status" aria-live="polite" hidden></div>
    <section id="login-panel" class="panel" hidden><h2>Conectar con Hopper</h2><p>Inicia sesión una vez en Hopper. Después podrás enviar desde cualquier pestaña mientras la sesión siga activa.</p><button id="login-button" class="button main-button" type="button">Abrir Hopper e iniciar sesión</button></section>
    <div id="workspace" hidden>
      <section class="panel"><div class="section-heading"><h2>Texto</h2><label class="ttl-choice">Expira en <select id="ttl" aria-label="Tiempo de expiración"><option value="5">5 min</option><option value="15">15 min</option><option value="30">30 min</option><option value="60">1 hora</option><option value="360">6 horas</option><option value="720">12 horas</option><option value="1440">1 día</option><option value="0">Anclado</option></select></label></div>
        <div class="text-row"><textarea id="content" maxlength="250000" rows="3" placeholder="Pega o escribe aquí…" aria-label="Texto para enviar"></textarea><button id="send-text" class="button icon-button main-button" type="button" title="Enviar texto" aria-label="Enviar texto"><svg viewBox="0 0 24 24"><path d="m3 11.3 17-7.2-6.5 16-2.4-6.8L3 11.3Zm8.1 2L20 4.1"/></svg></button></div>
      </section>
      <div class="quick-actions"><button type="button" id="paste" title="Pegar desde portapapeles"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 5V3h6v2"/></svg><span>Pegar</span></button><button type="button" id="attach" title="Adjuntar archivos"><svg viewBox="0 0 24 24"><path d="M8 12.5 14.7 5.8a4 4 0 0 1 5.7 5.7l-9.2 9.2A6 6 0 0 1 2.7 12l9.5-9.5"/></svg><span>Adjuntar</span></button><button type="button" id="capture" title="Copiar enlace de la pestaña actual al editor"><svg viewBox="0 0 24 24"><path d="M9 14.5 15 8.5M10 7.5l1.5-1.5a4 4 0 0 1 5.7 5.7L15.5 13M8.5 11l-2 2a4 4 0 1 0 5.7 5.7l1.5-1.5"/></svg><span>Enlace</span></button><button type="button" id="open" title="Abrir Hopper"><svg viewBox="0 0 24 24"><path d="M13 5h6v6m0-6-8 8M17 13v5H5V7h6"/></svg><span>Abrir</span></button></div>
      <section class="panel"><div class="section-heading"><h2>Archivos</h2><span class="quiet">Máx. 128 MB por archivo</span></div><div id="drop" class="drop" role="button" tabindex="0" aria-label="Adjuntar archivos">Adjunta o arrastra archivos aquí</div><input id="files" type="file" multiple hidden><div class="queue" id="queue" aria-live="polite"></div><div class="queue-footer"><button id="publish" class="button icon-button main-button" type="button" title="Publicar archivos" aria-label="Publicar archivos" disabled><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14.5v3A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5v-3"/></svg></button></div></section>
    </div>
    <button id="inbox" type="button" class="button bottom-button">Abrir Bandeja <span aria-hidden="true">↗</span></button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
