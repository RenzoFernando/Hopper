<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Recuperación segura del PIN de Hopper.">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#202123">
    <title>Recuperar acceso — Hopper</title>
    <link rel="icon" href="assets/favicon.ico" sizes="any">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/styles.css?v=20260908-4">
  </head>
  <body class="document-page compact-document-page">
    <div class="document-shell recovery-shell">
      <header class="site-header"><a class="brand" href="./" aria-label="Volver a Hopper"><img class="brand-mark" src="assets/favicon.svg" alt=""><span class="brand-name">HOPPER</span></a></header>
      <main class="recovery-main">
        <section class="recovery-card" aria-labelledby="recovery-title">
          <p class="eyebrow">RECUPERACIÓN</p><h1 id="recovery-title">Restablecer PIN</h1><p class="auth-copy">El enlace es temporal y solo puede utilizarse una vez.</p>
          <div class="loading-state recovery-loading" id="recovery-loading"><span class="spinner" aria-hidden="true"></span><span>Verificando enlace…</span></div>
          <form class="recovery-form" id="recovery-form" hidden novalidate><label for="new-pin">Nuevo PIN</label><input id="new-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="••••"><label for="confirm-pin">Confirmar PIN</label><input id="confirm-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="••••"><button class="primary-button" id="recovery-submit" type="submit">Guardar nuevo PIN</button></form>
          <div class="recovery-result" id="recovery-result" hidden><h2 id="recovery-result-title">Enlace no disponible</h2><p id="recovery-result-copy"></p><a class="secondary-link" href="./">Volver a Hopper</a></div>
          <p class="form-message" id="recovery-message" aria-live="polite"></p>
        </section>
      </main>
    </div>
    <footer class="project-footer"><p><a href="https://github.com/RenzoFernando/Hopper" target="_blank" rel="noopener noreferrer"><strong>Hopper</strong></a><span> — Transferencia temporal de texto y archivos</span></p><p>© 2026 — Renzo Fernando Mosquera Daza</p></footer>
    <script type="module" src="js/recover.js?v=20260908-4"></script>
  </body>
</html>
